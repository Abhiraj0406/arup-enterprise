name: 🚀 Deploy to Hostinger — arup-enterprise.com

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to arup-enterprise.com
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - name: 🚀 Sync code and update server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:        ${{ secrets.HOSTINGER_HOST }}
          username:    ${{ secrets.HOSTINGER_USER }}
          key:         ${{ secrets.HOSTINGER_SSH_KEY }}
          port:        ${{ secrets.HOSTINGER_PORT }}
          script_stop: true
          script: |
            cd "$HOME/domains/arup-enterprise.com"

            echo "=================================================="
            echo "  📥 Pulling latest code from GitHub..."
            echo "=================================================="
            if [ ! -d .git ]; then
              echo "  ⚙️ Initializing git repository on server..."
              git init
            fi

            # Authenticate using GitHub Actions temporary token
            git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git 2>/dev/null || git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git

            git fetch origin main
            git reset --hard origin/main

            # Sanitize remote URL after fetch
            git remote set-url origin https://github.com/${{ github.repository }}.git

            echo "=================================================="
            echo "  📁 Ensuring upload and asset directories..."
            echo "=================================================="
            mkdir -p public_html/uploads public_html/admin/uploads public_html/admin/Uploads storage/logs
            chmod -R 775 public_html/uploads public_html/admin/uploads public_html/admin/Uploads storage 2>/dev/null || true

            echo "=================================================="
            echo "  🔒 Verifying environment configuration..."
            echo "=================================================="
            if [ -f .env ]; then
              chmod 600 .env
              echo "✅ .env verified and permissions hardened (600)"
            else
              echo "⚠️  .env MISSING in $HOME/domains/arup-enterprise.com — site will not work without it!"
              echo "ℹ️  Create .env from .env.example before launching!"
            fi

            echo "=================================================="
            echo "  🗄️  Verifying database schema file..."
            echo "=================================================="
            if [ -f database/schema.sql ]; then
              echo "✅ database/schema.sql present"
            else
              echo "⚠️  database/schema.sql NOT found"
            fi
            echo "   ℹ️  First-time DB setup: import database/schema.sql via Hostinger phpMyAdmin"

            echo "=================================================="
            echo "  ✅ Deployment complete!"
            echo "  🌐 https://arup-enterprise.com"
            echo "=================================================="
